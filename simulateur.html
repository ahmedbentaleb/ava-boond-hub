<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ava Manager — Banc d'essai métier</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   LA LANGUE DU BANC — celle du constructeur Kurso, pas une autre.
   Une échelle de gris e0→e900 qui BASCULE avec la peau : e0 est le fond en clair
   et le premier plan en sombre. L'interface s'écrit une fois. Rayons 0 / 2 / 3 —
   rien d'arrondi, aucune capsule. Corps 13 px / 20 px. Chiffres en chasse fixe.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --police:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"IBM Plex Mono",monospace;
  /* CLAIR — traits sombres sur fond blanc */
  --e0:#fff; --e50:#f5f5f5; --e100:#ebebeb; --e150:#ddd; --e200:#d0d0d0; --e300:#b5b5b5; --e400:#9a9a9a;
  --e500:#808080; --e600:#656565; --e700:#4a4a4a; --e800:#2f2f2f; --e900:#141414; --sur-e900:#fff;
  --trait:#141414; --trait-2:#8a8a8a;
  --bleu:#0c79a8; --bleu-fond:#daedf8; --bleu-texte:#0b6e99;
  --orange:#a35e10; --orange-fond:#f8e8db; --vert:#27783f; --vert-fond:#e4f2e8; --rouge:#b63636; --rouge-fond:#fce5e3;
  --c1:#0c79a8; --c2:#6b3fb5; --c3:#27783f; --c4:#a35e10; --c5:#b63636;
  --ombre:0 1px 3px rgba(0,0,0,.1),0 8px 30px rgba(0,0,0,.08);
  --r-s:2px; --r-m:3px;
  color-scheme:light;
}
:root[data-skin="nuit"]{
  /* NUIT — lignes argentées sur graphite */
  --e0:#141414; --e50:#1d1d1d; --e100:#2a2a2a; --e150:#3a3a3a; --e200:#4a4a4a; --e300:#656565; --e400:#8d8d8d;
  --e500:#9a9a9a; --e600:#b5b5b5; --e700:#d0d0d0; --e800:#ebebeb; --e900:#fff; --sur-e900:#141414;
  --trait:#c9ccd1; --trait-2:#5c6067;
  --bleu:#41b2ec; --bleu-fond:#10364f; --bleu-texte:#9cd8fd;
  --orange:#e6a758; --orange-fond:#4a3318; --vert:#7fd3a0; --vert-fond:#1c3a28; --rouge:#f6807a; --rouge-fond:#4a2320;
  --c1:#41b2ec; --c2:#b79cf5; --c3:#7fd3a0; --c4:#e6a758; --c5:#f6807a;
  --ombre:0 1px 3px rgba(0,0,0,.5),0 10px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
/* Nuit : les cadres aussi prennent le fil argenté — un seul trait, partout, jamais une grille. */
:root[data-skin="nuit"] .card,:root[data-skin="nuit"] .kpi,:root[data-skin="nuit"] .note{border-color:var(--trait-2)}
:root[data-skin="nuit"] .journal{border-left-color:var(--trait-2)}
:root[data-skin="nuit"] .nav{border-right-color:var(--trait-2)}
:root[data-skin="avaliance"]{
  /* AVALIANCE — la charte du site, à plat : violet porteur, vert dessous, jamais d'encre verte */
  --police:"Sora",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --e0:#fff; --e50:#f7f5f8; --e100:#efeaf0; --e150:#e2dbe4; --e200:#cfc4d2; --e300:#b09fb4; --e400:#8f7a94;
  --e500:#6e5874; --e600:#5D5D5D; --e700:#3f2f43; --e800:#2E0734; --e900:#430A4B; --sur-e900:#fff;
  --trait:#430A4B; --trait-2:#b09fb4;
  --bleu:#430A4B; --bleu-fond:#AEBF38; --bleu-texte:#430A4B;
  --orange:#C75B12; --orange-fond:#FBEFE6; --vert:#1E5B3A; --vert-fond:#AEBF38; --rouge:#A93226; --rouge-fond:#F8ECEA;
  --c1:#430A4B; --c2:#7B3F86; --c3:#8f9a24; --c4:#5D5D5D; --c5:#A93226;
  --ombre:none;
  color-scheme:light;
}
:root{ /* alias lus par les écrans : ils suivent la peau par l'échelle */
  --brand:var(--e900); --ink:var(--e900); --ink3:var(--e600); --surf3:var(--e100);
  --crit:var(--rouge); --ok:var(--vert); --warn:var(--orange); --neu:var(--e400); --f-display:var(--police);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--e0);color:var(--e800);font:13px/20px var(--police);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:500}
:focus-visible{outline:2px solid var(--e900);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════════ La coquille ═══════════ */
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.bar{flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;height:48px;border-bottom:1px solid var(--trait);background:var(--e0)}
.marque{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;letter-spacing:-.2px;color:var(--e900)}
.marque svg{width:18px;height:18px;display:block}
.marque .sub{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--e600);letter-spacing:0;margin-left:4px;padding-left:10px;border-left:1px solid var(--e200)}
.bar .sep{flex:1 1 auto}
.monde{font-family:var(--mono);font-size:11px;color:var(--e600);white-space:nowrap;letter-spacing:.02em}
.champ{display:flex;align-items:center;gap:8px}
.champ label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--e600)}
.champ select{background:var(--e0);color:var(--e800);border:1px solid var(--e200);border-radius:var(--r-m);padding:6px 9px;min-height:32px;font-size:12.5px}
.champ select:focus{border-color:var(--e600);outline:0}
.peaux{display:inline-flex;border:1px solid var(--e200);border-radius:var(--r-m);overflow:hidden}
.peaux button{border:0;background:transparent;color:var(--e700);padding:6px 12px;min-height:32px;font-size:12px}
.peaux button+button{border-left:1px solid var(--e200)}
.peaux button:hover{background:var(--e50)}
.peaux button[aria-pressed="true"]{background:var(--e900);color:var(--sur-e900);font-weight:500}
.bar .reset{border:1px solid var(--e200);background:transparent;color:var(--e800);border-radius:var(--r-m);padding:6px 12px;min-height:32px;font-size:12px}
.bar .reset:hover{background:var(--e50)}

.corps{flex:1 1 auto;display:flex;min-height:0}
.nav{flex:0 0 216px;background:var(--e50);border-right:1px solid var(--e150);overflow:auto;padding:0 0 24px}
.nav h2{padding:13px 16px 5px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--e600);font-weight:600}
.nav button{width:100%;border:0;background:transparent;text-align:left;color:var(--e700);padding:7px 16px;display:flex;align-items:center;gap:9px;min-height:36px;font-size:13px}
.nav button i{width:7px;height:7px;flex:none;background:var(--dot,var(--e400))}
.nav button:hover{background:var(--e100);color:var(--e900)}
.nav button[aria-current="page"]{background:var(--e900);color:var(--sur-e900);font-weight:600}
.nav button[aria-current="page"] i{box-shadow:0 0 0 1.5px var(--sur-e900)}
.nav button[disabled]{opacity:.5;cursor:not-allowed}
.nav button[disabled]:hover{background:none}

.vue{flex:1 1 auto;min-width:0;overflow:auto;padding:20px 22px 44px}
.journal{flex:0 0 300px;border-left:1px solid var(--e150);background:var(--e0);display:flex;flex-direction:column;min-height:0}

/* ═══════════ Les têtes ═══════════ */
.eyebrow{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--e600);font-weight:600;margin-bottom:6px}
.eyebrow i{width:7px;height:7px;background:var(--dot,var(--e400))}
h1{font-size:22px;line-height:28px;letter-spacing:-.3px;color:var(--e900);font-weight:500}
:root[data-skin="avaliance"] h1{font-weight:700;text-transform:uppercase;letter-spacing:0;font-size:20px}
.lead{margin:5px 0 18px;color:var(--e600);font-size:12.5px;line-height:18px;max-width:70ch}
.lead strong{color:var(--e800);font-weight:600}
h3{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--e600);font-weight:600;margin-bottom:10px}

/* ═══════════ Blocs, chiffres, tableaux ═══════════ */
.card{border:1px solid var(--e150);border-radius:var(--r-m);padding:14px 16px;background:var(--e0)}
.card.stroke{border-top:2px solid var(--dot,var(--e900))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin-bottom:20px}
.kpi{border:1px solid var(--e150);border-top:2px solid var(--dot,var(--e900));border-radius:var(--r-m);padding:11px 13px;background:var(--e0)}
.kpi .n{font-family:var(--mono);font-size:24px;line-height:30px;letter-spacing:-.5px;color:var(--e900);font-variant-numeric:tabular-nums}
.kpi .l{color:var(--e600);font-size:11.5px;margin-top:2px}

.tab-box{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--e600);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:0 10px 8px 0;border-bottom:1px solid var(--trait);white-space:nowrap}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--e150);vertical-align:middle}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.dim{color:var(--e600)}
.tiny{font-size:11px;color:var(--e600);line-height:15px}
.id{font-family:var(--mono);font-size:11px;color:var(--e600);letter-spacing:.01em}

/* ⛔ Rayon 2 px, jamais 999 : les capsules sont interdites. Un badge est un
   bloc carré, chasse fixe, capitales — et un point carré de 6 px pour l'état. */
.bd{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;line-height:16px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:var(--r-s);white-space:nowrap;background:var(--e100);color:var(--e700)}
.bd::before{content:"";width:6px;height:6px;background:currentColor;flex:none}
.bd.pos{background:var(--vert-fond);color:var(--vert)}
.bd.enc{background:var(--bleu-fond);color:var(--bleu-texte)}
.bd.neg{background:var(--rouge-fond);color:var(--rouge)}
.bd.warn{background:var(--orange-fond);color:var(--orange)}
.bd.neu{background:var(--e100);color:var(--e600)}
:root[data-skin="avaliance"] .bd.pos,:root[data-skin="avaliance"] .bd.enc{background:#AEBF38;color:#430A4B}

/* ═══════════ Les commandes ═══════════ */
.b{border:1px solid var(--e900);background:var(--e900);color:var(--sur-e900);padding:7px 14px;border-radius:var(--r-m);font-weight:500;display:inline-flex;align-items:center;gap:7px;min-height:34px;white-space:nowrap;font-size:12.5px}
.b:hover{opacity:.88}
.b.sec{background:transparent;color:var(--e800);border-color:var(--e200)}
.b.sec:hover{background:var(--e50);opacity:1}
.b.ghost{background:transparent;color:var(--e700);border-color:transparent}
.b.ghost:hover{background:var(--e100);opacity:1}
.b.sm{padding:4px 10px;min-height:28px;font-size:12px}
.b.danger{background:transparent;color:var(--rouge);border-color:var(--rouge)}
.b.danger:hover{background:var(--rouge-fond);opacity:1}
.b:disabled,.b.dis{opacity:.45;cursor:not-allowed}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (pointer:coarse){.b,.b.sm{min-height:44px}}

.form{display:grid;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-weight:500;font-size:12.5px;color:var(--e800)}
.f input,.f select,.f textarea,.inl{width:100%;background:var(--e0);color:var(--e800);border:1px solid var(--e200);border-radius:var(--r-m);padding:8px 10px;min-height:36px;font-size:13px}
.f input:focus,.f select:focus,.inl:focus{border-color:var(--e600);outline:0}
.f .req{color:var(--rouge);font-size:11px;font-weight:400;margin-left:4px}
.f .help{color:var(--e600);font-size:11.5px;line-height:15px}
.inl{width:auto}

/* ═══════════ Encadrés ═══════════ */
.note{border:1px solid var(--e150);border-left:3px solid var(--e900);border-radius:var(--r-m);padding:11px 14px;font-size:12.5px;line-height:18px;color:var(--e700);background:var(--e0)}
.note strong{color:var(--e900);font-weight:600}
.note .t{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:4px;color:var(--e900)}
.note.mur{border-left-color:var(--rouge)}.note.mur .t{color:var(--rouge)}
.note.ok{border-left-color:var(--vert)}.note.ok .t{color:var(--vert)}
.note.warn{border-left-color:var(--orange)}.note.warn .t{color:var(--orange)}
:root[data-skin="avaliance"] .note.ok .t{color:#1E5B3A}

/* ═══════════ Le journal ═══════════ */
.journal .head{padding:12px 14px 10px;border-bottom:1px solid var(--e150);display:flex;align-items:center;justify-content:space-between;flex:none}
.journal .head h3{margin:0}
.journal .flux{flex:1 1 auto;overflow:auto;padding:0 14px 14px}
.ev{position:relative;padding:8px 0 8px 16px;border-bottom:1px solid var(--e150)}
.ev::before{content:"";position:absolute;left:2px;top:14px;width:7px;height:7px;background:var(--vert)}
.ev.refus::before{background:var(--rouge)}
.ev .ty{font-family:var(--mono);font-size:11px;color:var(--e900);letter-spacing:.01em}
.ev.refus .ty{color:var(--rouge)}
.ev .de{font-size:11.5px;color:var(--e700);line-height:16px;margin-top:1px}
.ev .me{font-size:10.5px;color:var(--e600);font-family:var(--mono);margin-top:2px;word-break:break-all}

/* ═══════════ Le message ═══════════ */
.msg{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;max-width:min(640px,92vw);z-index:50;border-radius:var(--r-m);padding:12px 16px;font-size:12.5px;line-height:18px;background:var(--e0);color:var(--e800);border:1px solid var(--e900);box-shadow:var(--ombre)}
.msg.ko{border-color:var(--rouge);box-shadow:inset 0 0 0 1px var(--rouge),var(--ombre)}
.msg .t{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:3px;color:var(--vert)}
.msg.ko .t{color:var(--rouge)}
.msg .src{font-family:var(--mono);font-size:11px;margin-top:6px;color:var(--e600)}
.msg[hidden]{display:none!important}

/* ═══════════ La charge ═══════════ */
.charge{display:flex;gap:2px;align-items:flex-end;height:30px}
.charge i{flex:1 1 0;display:block;min-width:4px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--e700)}
.lg i{width:12px;height:12px;display:inline-block;border:1px solid var(--e200)}

/* ═══════════ Politiques ═══════════ */
tr.hb td{opacity:.55}
tr.rouge td{background:var(--rouge-fond)}

@media (max-width:1200px){.journal{display:none}}
@media (max-width:900px){
  .corps{flex-direction:column}
  .nav{flex:none;display:flex;overflow-x:auto;padding:4px;border-right:0;border-bottom:1px solid var(--e150)}
  .nav h2{display:none}
  .nav button{width:auto;white-space:nowrap;min-width:0;padding:8px 12px;min-height:44px}
  .vue{padding:14px}
  .bar{height:auto;padding:8px 12px;flex-wrap:wrap;gap:8px}
}
</style>

<div class="app">
  <header class="bar">
    <span class="marque">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 16 11 2h3L5 16z" fill="currentColor"/><path d="M8 16 16 4h-3L5 16z" fill="currentColor" opacity=".5"/></svg>
      Ava Manager <span class="sub">banc d'essai métier</span>
    </span>
    <span class="sep"></span>
    <span class="monde" id="monde"></span>
    <span class="champ"><label for="sel-role">Je suis</label><select id="sel-role"></select></span>
    <span class="peaux" role="group" aria-label="Apparence">
      <button type="button" data-skin="nuit">Nuit</button>
      <button type="button" data-skin="clair">Clair</button>
      <button type="button" data-skin="avaliance">Avaliance</button>
    </span>
    <button type="button" class="reset" id="btn-reset">Réinitialiser</button>
  </header>
  <div class="corps">
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <main class="vue" id="vue"></main>
    <aside class="journal">
      <div class="head"><h3>Journal métier</h3><span class="tiny mono" id="ev-n"></span></div>
      <div class="flux" id="flux"></div>
    </aside>
  </div>
</div>
<div class="msg" id="msg" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
var CLE="ava-banc-v1",CLE_SKIN="ava-banc-skin";

/* ===================== SCHÉMA — colonnes connues, contraintes physiques (livrable 5 §9) ===================== */
var SCHEMA={
  personne:{cols:["id","nom","ville","pays","archive_le"],historique:true},
  pc:{cols:["id","personne","titre","etat","provenance","dispo","archive_le"],unique:["personne"],historique:true,fk:{personne:"personne"}},
  pr:{cols:["id","personne","titre","type","etat","agence","fournisseur","cout","tjm","archive_le"],unique:["personne"],historique:true,fk:{personne:"personne"}},
  societe:{cols:["id","nom","roles","secteur","ville","statut","archive_le"],historique:true},
  unite:{cols:["id","societe","parent","type","nom","statut","archive_le"],historique:true,fk:{societe:"societe"}},
  contact:{cols:["id","societe","unite","nom","fonction","statut","archive_le"],historique:true,fk:{societe:"societe"}},
  besoin:{cols:["id","societe","contact","agence","titre","type","etat","precedent","priorite","postes","demarrage","archive_le"],historique:true,fk:{societe:"societe"}},
  pos:{cols:["id","besoin","pc","pr","personne","etat","cv","motif","decision","archive_le"],historique:true,xor:["pc","pr"],fk:{besoin:"besoin",pc:"pc",pr:"pr"}},
  projet:{cols:["id","societe","contact","besoin","agence","type","titre","etat","devise_defaut","archive_le"],historique:true,fk:{societe:"societe"}},  /* D-9 : aucune devise porteuse — seulement une devise PROPOSÉE au formulaire */
  prestation:{cols:["id","projet","pr","etat","debut","fin","taux","tjm","cjm","devise","cjm_devise","jours","cloture","archive_le"],historique:true,immuable:["pr"],economiques:["tjm","cjm","devise","cjm_devise","jours"],fk:{projet:"projet",pr:"pr"}},
  temps:{cols:["id","prestation","pr","jour","qte","ajust"],historique:true,fk:{prestation:"prestation",pr:"pr"},trigger:"temps_pr"},
  absence:{cols:["id","pr","type","debut","fin"],historique:true,fk:{pr:"pr"}},
  action:{cols:["id","societe","contact","pc","pr","besoin","projet","type","contenu"],historique:true,unPorteur:["societe","contact","pc","pr","besoin","projet"]},
  snap:{cols:["id","prestation","le","version","tempsSaisis","ca","ca_devise","cout","cout_devise","marge","marge_motif"],appendOnly:true,mur:"M-6"},
  ev:{cols:["id","t","o","r","d","p","a","h","ko"],appendOnly:true,mur:"M-7"}
};
function Mur(id,msg){this.mur=id;this.msg=msg;}
var MUR_MSG={
  "M-1":"Aucune clé étrangère de prestation ni de temps ne pointe vers un candidat : la colonne référence profil_ressource, et rien d'autre. Convertissez d'abord.",
  "M-2":"CHECK XOR refusé : (candidat vide) doit être différent de (ressource vide). Un positionnement porte exactement un humain.",
  "M-3":"UNIQUE(personne) refusé : cette personne a déjà un profil de ce type. Deux profils, ce sont deux coûts de référence et deux vérités.",
  "M-4":"Trigger BEFORE UPDATE : la ressource d'une prestation est immuable. Clôturez et créez une nouvelle prestation — sinon les temps déjà saisis changeraient de propriétaire.",
  "M-5":"Colonne inconnue. La table projet n'a pas de colonne ressource : les personnes d'un projet se lisent dans ses prestations.",
  "M-6":"Table en INSERT et SELECT seulement : un snapshot de marge ne se réécrit pas. La marge de clôture ne bouge pas quand un coût de référence change.",
  "M-7":"Journal en ajout seul : un événement ne se modifie ni ne s'efface. Un historique qu'on corrige n'est pas un historique.",
  "M-8":"Aucun DELETE sur un objet historique : le rôle applicatif n'a pas ce droit. Archivez — l'objet sort des vues actives, ses liens et son passé restent.",

    if(p.pr!==prid||j<p.debut||j>p.fin)return;
    var c=categorie(p.etat);
    if(c==="engage")e+=p.taux;else if(c==="previsionnel")pv+=p.taux;
  });
  return {engage:e,previsionnel:pv};
}
function prestationsSignees(b){
  var n=0,vus={};

    if(pj.besoin!==b.id)return;

      if(c==="engage"||c==="clos"){n++;var r=get("pr",p.pr);if(r)vus[r.personne]=1;}

/* §4 : passage client — appelé à la signature (défaut) ou à la création de projet */
function effetsPassageClient(societeId,declencheurAttendu,contactId){
  if(pol("societe.passage_client.declencheur")!==declencheurAttendu)return "";
  var soc=get("societe",societeId);
  if(!soc||soc.roles.indexOf("interne")>=0)return "";
  var portee=pol("societe.passage_client.propagation"),ecrits=[];
  if(soc.statut!=="client"){db.update("societe",soc.id,{statut:"client"});ecrits.push(soc.nom);}  /* D-3 : le statut, jamais les rôles */
  if(portee==="toute_la_societe"){
    S.unite.forEach(function(u){if(u.societe===soc.id&&u.statut!=="client"){db.update("unite",u.id,{statut:"client"});ecrits.push(u.nom);}});
    S.contact.forEach(function(c){if(c.societe===soc.id&&c.statut!=="client"){db.update("contact",c.id,{statut:"client"});ecrits.push(c.nom);}});
  }else if(portee==="branche_contractante_et_contacts_du_service"){
    var ct=contactId?get("contact",contactId):null,u=ct&&ct.unite?get("unite",ct.unite):null,garde=0;
    while(u&&garde++<20){
      if(u.statut!=="client"){db.update("unite",u.id,{statut:"client"});ecrits.push(u.nom);}
      var uid=u.id;
      S.contact.forEach(function(c){if(c.unite===uid&&c.statut!=="client"){db.update("contact",c.id,{statut:"client"});ecrits.push(c.nom);}});
      u=u.parent?get("unite",u.parent):null;   /* on remonte la branche ; une sœur reste NULL = prospect */
    }
  }
  if(!ecrits.length)return "";
  ev("ClientStatusDerived","societe",soc.id,"passage client ("+portee.replace(/_/g," ")+") — écrit sur : "+ecrits.join(", "),"societe.passage_client.declencheur, societe.passage_client.propagation");
  return " Passage client : "+ecrits.join(", ")+" — une branche sœur reste prospect.";
}
/* E-1 : tout passage en engage produit les mêmes effets, quel que soit le chemin */
function effetsSignature(p){
  var msg="";
  ev("PrestationSigned","prestation",p.id,nomPr(p.pr)+" — mission engagée","");
  var pj=get("projet",p.projet);
  msg+=effetsPassageClient(pj.societe,"premiere_prestation_signee",pj.contact);
  if(pj.besoin){
    var b=get("besoin",pj.besoin),mode=pol("besoin.pourvu.mode");
    if(b&&categorie(b.etat)==="en_recherche"&&mode!=="manuel_avec_garde"){
      var s=prestationsSignees(b);
      var ok=mode==="auto_par_prestation_signee"?s.prestations>=b.postes:s.personnes>=b.postes;
      if(ok){db.update("besoin",b.id,{etat:"pourvu"});
        ev("NeedStateChanged","besoin",b.id,"vers pourvu — automatique à la signature ("+mode.replace(/_/g," ")+")","besoin.pourvu.mode");
        msg+=" Le besoin "+b.id+" passe à pourvu tout seul : réglage actuel, pas le défaut.";}
    }
  }
  return msg;
}
function gardeSignature(d){
  var tjm=num(d.tjm),jours=num(d.jours),taux=num(d.taux);
  if(!(tjm>0)||!(jours>0)||!(taux>0))
    return KO("machines §5 · garde de signature","TJM vendu, jours vendus et taux d'occupation doivent être numériques et positifs. Saisissez un TJM, même fictif : le banc ne certifie aucun euro.");
  return null;
}
/* E-3 : une seule garde de création depuis un besoin, pour le manuel comme pour l'automatique */
function creerProjetDepuisBesoin(b,contactId,titre,auto){
  if(categorie(b.etat)==="ferme")return KO("cycle besoin","Ce besoin est fermé.");
  if(pol("besoin.projets_max")==="un_seul"&&S.projet.some(function(p){return p.besoin===b.id;}))
    return KO("politique besoin.projets_max","Ce besoin a déjà un projet et le réglage n'en autorise qu'un.");
  if(pol("projet.depuis_besoin.garde")==="retenu_requis"){
    var retenus=S.pos.filter(function(p){return p.besoin===b.id&&categorie(p.etat)==="terminal_positif";});
    if(!retenus.length)return KO("F1 · politique projet.depuis_besoin.garde","Aucun positionnement retenu sur ce besoin. Enregistrez d'abord le retour client.");
    if(pol("projet.depuis_besoin.garde_profil")==="personne_avec_ressource"){
      if(!retenus.some(function(p){return S.pr.some(function(r){return r.personne===p.personne&&categorie(r.etat)!=="sorti";});}))
        return KO("G1 · politique projet.depuis_besoin.garde_profil","La personne retenue n'a pas de profil ressource actif. Convertissez le candidat, puis revenez : c'est la même personne, la garde le reconnaîtra.");
    }else if(!retenus.some(function(p){return !!p.pr;})){
      return KO("G1 · réglage strict","Le réglage strict exige un positionnement porté par un profil ressource. Un candidat converti ne suffit pas — c'est l'autre lecture de F1.");
    }
  }
  var contact=contactId||b.contact;
  if(pol("projet.contact")==="obligatoire"&&!contact)
    return KO("US5 · F4 · politique projet.contact","Le besoin n'a pas de contact. Donnez-en un maintenant : le besoin reste valide sans, le projet non.");
  if(contact){var ct=get("contact",contact);if(!ct||ct.societe!==b.societe)return KO("M-12 · cohérence",MUR_MSG["M-12"]);}
  var pj=db.insert("projet",{societe:b.societe,contact:contact||null,besoin:b.id,agence:b.agence,type:b.type,titre:titre||b.titre,etat:"ouvert",devise_defaut:"EUR"});
  ev("ProjectCreated","projet",pj.id,pj.titre+" — depuis "+b.id+(auto?" — automatique au retenu (réglage projet.creation_depuis_besoin)":""),"projet.depuis_besoin.garde, projet.depuis_besoin.garde_profil, projet.contact, besoin.projets_max");
  var m=effetsPassageClient(b.societe,"creation_projet",contact);
  return OK("Projet "+pj.id+" créé. Le besoin n'a pas changé d'état, aucune prestation n'a été créée."+m,"projet.depuis_besoin.garde, projet.contact");
}
function cloturerPrestation(p,date){
  var t=S.temps.filter(function(x){return x.prestation===p.id;}).reduce(function(a,b){return a+b.qte;},0);
  db.update("prestation",p.id,{etat:"cloturee",cloture:date||p.fin});
  var tjm=num(p.tjm),cjm=num(p.cjm),cjmDev=p.cjm_devise||p.devise;
  var ca=tjm?t*tjm:null,cout=cjm?t*cjm:null;
  /* D-9 / M-15 : la marge n'existe que si vente et coût sont dans la même devise — aucun taux n'est saisi */
  /* trois raisons distinctes de n'avoir pas de marge — on écrit laquelle, sinon l'écran ment */
  var motif=null;
  if(cjmDev!==p.devise)motif="devises";                 /* M-15 : vendu et payé dans deux devises, aucun taux */
  else if(ca==null)motif="ca";                          /* ATL-16 : aucun TJM saisi, CA non chiffré */
  else if(cout==null)motif="cout";                      /* aucun CJM saisi */
  var marge=motif?null:ca-cout;
  db.insert("snap",{prestation:p.id,le:new Date().toISOString(),version:"ATL-2026-09-16",tempsSaisis:t,ca:ca,ca_devise:p.devise,cout:cout,cout_devise:cjmDev,marge:marge,marge_motif:motif});
  ev("PrestationClosed","prestation",p.id,nomPr(p.pr)+" — marge figée, "+t.toFixed(1)+" jour(s) saisis"+(marge==null?" — marge « — » : "+p.devise+" / "+cjmDev+", pas de taux":""),"change.mode");
  return t;
}

function positionner(d,cmdName){

  var b=get("besoin",d.besoin);if(!b)return KO("objet","Besoin introuvable.");
  var pe=perimetre(b.agence);if(pe)return pe;
  var cat=categorie(b.etat),alerte="";
  if(cat!=="a_pourvoir"&&cat!=="en_recherche"){
    var m=pol("positionnement.sur_besoin_inactif");
    if(m==="refus")return KO("F5 · politique positionnement.sur_besoin_inactif","Le besoin est « "+b.etat+" ». Réactivez-le avant un nouveau positionnement.");
    if(m==="alerte")alerte=" Alerte : le besoin est « "+b.etat+" » — le positionnement passe quand même, c'est le réglage.";
  }
  var prof=d.pc?get("pc",d.pc):get("pr",d.pr);if(!prof)return KO("objet","Profil introuvable.");
  var personne=prof.personne,uni=pol("positionnement.unicite");
  if(uni!=="aucune"){
    var dup=S.pos.some(function(p){
      if(p.besoin!==b.id||p.personne!==personne)return false;
      if(uni==="historique")return true;
      var c=categorie(p.etat);return c==="propose"||c==="presente";

    if(dup)return KO("G7 · politique positionnement.unicite",uni==="historique"?"Cette personne a déjà été proposée sur ce besoin, un jour. Le réglage historique l'interdit à jamais.":"Cette personne est déjà proposée sur ce besoin. Après un refus ou un retrait, elle pourra l'être à nouveau.");
  }
  var p=db.insert("pos",{besoin:b.id,pc:d.pc||null,pr:d.pr||null,personne:personne,etat:"propose",cv:false,motif:null,decision:null});
  var msg="Positionnement créé, état « proposé ».";
  if(pol("besoin.staffing.declencheur")==="premier_positionnement"&&cat==="a_pourvoir"){
    db.update("besoin",b.id,{etat:"staffing"});
    ev("NeedStateChanged","besoin",b.id,"à pourvoir vers en recherche — premier positionnement","besoin.staffing.declencheur");
    msg+=" Le besoin passe en recherche : c'est son premier positionnement.";
  }
  ev("PositioningCreated","pos",p.id,nomPersonne(personne)+" sur "+b.titre+alerte,"positionnement.unicite, positionnement.sur_besoin_inactif");
  return OK(msg+alerte,"besoin.staffing.declencheur, positionnement.unicite, positionnement.sur_besoin_inactif");
}

  var b=get("besoin",d.besoin);if(!b)return KO("objet","Besoin introuvable.");
  if(categorie(b.etat)!=="en_recherche")return KO("cycle besoin","« Pourvu » se déclare depuis « en recherche ». Ce besoin est « "+b.etat+" ».");
  if(pol("besoin.pourvu.mode")!=="manuel_avec_garde")return KO("politique besoin.pourvu.mode","Sous ce réglage, « pourvu » se déclenche tout seul à la signature. Rien à déclarer.");
  var s=prestationsSignees(b),g=pol("besoin.pourvu.garde_minimale");
  if(g==="tous_les_postes_signes"&&s.prestations<b.postes)
    return KO("F3 (3B) · T-1 · politique besoin.pourvu.garde_minimale",s.prestations+" prestation(s) signée(s) pour "+b.postes+" poste(s) visés. Le besoin reste en recherche tant que tous les postes ne sont pas signés — c'est la ligne d'Ahmed.");
  if(g==="une_prestation_signee"&&s.prestations<1)
    return KO("G4 · politique besoin.pourvu.garde_minimale","Aucune prestation signée ne rattache une personne à ce besoin.");
  db.update("besoin",b.id,{etat:"pourvu"});
  ev("NeedStateChanged","besoin",b.id,"vers pourvu — "+s.prestations+" prestation(s) signée(s), "+s.personnes+" personne(s), "+b.postes+" poste(s)","besoin.pourvu.mode, besoin.pourvu.garde_minimale");
  return OK("Besoin déclaré pourvu : "+s.prestations+" prestation(s) signée(s) sur "+b.postes+" poste(s), "+s.personnes+" personne(s) distincte(s). Rien ne l'a fait à votre place.","besoin.pourvu.garde_minimale");
};

CMD.CreatePrestation=function(d){
  var e=droit("CreatePrestation");if(e)return e;
  var pj=get("projet",d.projet);if(!pj)return KO("objet","Projet introuvable.");
  if(categorie(pj.etat)==="clos")return KO("cycle projet","Ce projet est clos.");
  if(!d.debut||!d.fin||d.fin<d.debut)return KO("cohérence des dates","La date de fin ne peut pas précéder la date de début.");
  var taux=num(d.taux);if(!(taux>0))return KO("champs requis","Le taux d'occupation est obligatoire et strictement positif.");
  var etat=d.etat==="signee"?"signee":"previsionnelle";
  if(etat==="signee"){
    if(!peut("SignPrestation"))return KO("O-2 · machines §5 · DEC-17","Créer une mission déjà signée, c'est la signer : il faut le droit de signature (O-2). Créez-la prévisionnelle, ou changez de rôle pour Directeur de projet.");
    var g=gardeSignature(d);if(g)return g;
  }
  var seuil=parseInt(pol("prestation.surcharge.seuil_pct"),10),mode=pol("prestation.surcharge.mode"),depasse=[];
  if(etat==="signee")jours(d.debut,d.fin).forEach(function(j){if(ouvre(j)&&chargeJour(d.pr,j).engage+taux>seuil)depasse.push(j);});
  if(depasse.length&&mode==="refus")
    return KO("DEC-10 · C-2 · politique prestation.surcharge.mode","Charge engagée au-dessus de "+seuil+" % sur "+depasse.length+" jour(s) ouvré(s). Le réglage actuel refuse — le défaut Avaliance se contente d'alerter.");
  /* D-9 : la devise est celle de la prestation ; deux devises sur un projet = bifurcation */
  var devise=["EUR","USD","MAD"].indexOf(d.devise)>=0?d.devise:(pj.devise_defaut||"EUR"),mixte="";
  var cjmDevise=["EUR","USD","MAD"].indexOf(d.cjm_devise)>=0?d.cjm_devise:devise;   /* D-9 : par défaut = celle de la vente */
  var premiere=S.prestation.filter(function(x){return x.projet===pj.id;})[0];
  if(premiere&&premiere.devise!==devise){
    if(pol("projet.devises_mixtes")==="refus")return KO("D-9 · politique projet.devises_mixtes","Ce projet est en "+premiere.devise+" ; une prestation en "+devise+" est refusée par le réglage actuel. Le défaut l'autorise — un freelance en MAD sur un projet en EUR est un cas réel.");
    mixte=" Ce projet porte maintenant deux devises ("+premiere.devise+", "+devise+") : ses chiffres s'affichent par devise, jamais additionnés.";
  }
  /* M-1 : la clé étrangère refuse un candidat — c'est db qui le dit */
  var p=db.insert("prestation",{projet:pj.id,pr:d.pr,etat:etat,debut:d.debut,fin:d.fin,taux:taux,tjm:num(d.tjm),cjm:num(d.cjm),devise:devise,cjm_devise:cjmDevise,jours:num(d.jours)||0,cloture:null});
  ev("PrestationCreated","prestation",p.id,nomPr(p.pr)+" sur "+pj.titre+" — "+taux+" %, "+etat+", "+devise+(mixte?" — devises mixtes":""),"prestation.surcharge.mode, prestation.surcharge.seuil_pct, projet.devises_mixtes");
  var msg="Prestation créée en « "+etat+" », vendue en "+devise+", coût en "+cjmDevise+". La ressource et les conditions sont verrouillées dès la signature (M-14)."+mixte+
    (cjmDevise!==devise?" ⚠️ Vente et coût dans deux devises : la marge de cette mission vaudra « — » à la clôture, aucun taux n'est saisi.":"");
  if(etat==="signee")msg+=effetsSignature(p);
  if(depasse.length&&mode==="alerte")msg+=" Alerte : "+seuil+" % engagés dépassés sur "+depasse.length+" jour(s) ouvré(s), du "+fr(depasse[0])+" au "+fr(depasse[depasse.length-1])+". Le prévisionnel ne compte pas dans cette garde.";
  if(depasse.length&&mode==="silencieux")msg+=" Un dépassement existe mais le réglage actuel ne le signale pas.";
  return OK(msg,"prestation.surcharge.mode, prestation.surcharge.seuil_pct, projet.devises_mixtes, societe.passage_client.declencheur");
};

CMD.CancelPrestation=function(d){
  var e=droit("CancelPrestation");if(e)return e;
  var p=get("prestation",d.prestation);if(!p)return KO("objet","Prestation introuvable.");
  var c=categorie(p.etat);if(c!=="previsionnel"&&c!=="engage")return KO("cycle prestation","Cette prestation n'est plus annulable.");
  var n=S.temps.filter(function(x){return x.prestation===p.id;}).length;
  if(n&&pol("prestation.annulation.garde")==="aucun_temps_saisi")
    return KO("G11 · politique prestation.annulation.garde",n+" ligne(s) de temps existent sur cette mission. Clôturez-la au lieu de l'annuler : le travail fait ne s'efface pas.");
  db.update("prestation",p.id,{etat:"annulee"});
  ev("PrestationCancelled","prestation",p.id,nomPr(p.pr)+" — annulée","prestation.annulation.garde");
  return OK("Prestation annulée.","prestation.annulation.garde");
};
CMD.CloseProject=function(d){
  var e=droit("CloseProject");if(e)return e;
  var pj=get("projet",d.projet);if(!pj)return KO("objet","Projet introuvable.");
  if(categorie(pj.etat)==="clos")return KO("cycle projet","Déjà clos.");
  var ouvertes=S.prestation.filter(function(p){var c=categorie(p.etat);return p.projet===pj.id&&(c==="engage"||c==="previsionnel");});
  if(ouvertes.length&&pol("projet.cloture.garde")==="prestations_closes")
    return KO("F7 · politique projet.cloture.garde",ouvertes.length+" prestation(s) encore ouverte(s). Clôturez-les d'abord — chacune écrit sa marge au passage.");
  var nc=0,na=0;
  ouvertes.forEach(function(p){
    if(categorie(p.etat)==="engage"){cloturerPrestation(p,null);nc++;}
    else{db.update("prestation",p.id,{etat:"annulee"});ev("PrestationCancelled","prestation",p.id,nomPr(p.pr)+" — annulée par la clôture en cascade du projet","projet.cloture.garde");na++;}
  });
  db.update("projet",pj.id,{etat:"clos"});
  ev("ProjectClosed","projet",pj.id,pj.titre+" clos"+(ouvertes.length?" — cascade : "+nc+" clôturée(s) avec snapshot, "+na+" prévisionnelle(s) annulée(s)":""),"projet.cloture.garde");
  return OK("Projet clos."+(ouvertes.length?" Cascade (réglage actuel) : "+nc+" mission(s) clôturée(s) avec leur vraie somme de temps, "+na+" prévisionnelle(s) annulée(s).":""),"projet.cloture.garde");
};
CMD.RecordTimesheet=function(d){
  var p=get("prestation",d.prestation);if(!p)return KO("objet","Prestation introuvable.");
  var mp=maPersonne(),propre=mp&&get("pr",p.pr)&&get("pr",p.pr).personne===mp;
  if(!peut("RecordTimesheet")&&!(peut("RecordOwnTimesheet")&&propre))
    return KO("DEC-17 · périmètre","Vous ne pouvez saisir que vos propres temps. Cette mission est portée par "+nomPr(p.pr)+".");
  var q=num(d.qte);if(!(q>0))return KO("champs requis","La quantité doit être strictement positive.");
  var cat=categorie(p.etat);
  if(cat==="clos"){
    if(pol("temps.correction_apres_cloture")==="refus")return KO("F34 · politique temps.correction_apres_cloture","Mission clôturée : le réglage actuel refuse toute correction.");
    db.insert("temps",{prestation:p.id,pr:p.pr,jour:d.jour,qte:q,ajust:true});
    ev("TimesheetAdjustedAfterClose","temps",p.id,"ajustement daté sur mission close — le snapshot ne bouge pas","temps.correction_apres_cloture");
    return OK("Ajustement enregistré, et marqué comme tel. Le snapshot de marge n'a pas bougé.","temps.correction_apres_cloture");
  }
  if(cat!=="engage")return KO("cycle prestation","Le temps se saisit sur une mission signée. Celle-ci est « "+p.etat+" ».");
  if(pol("temps.periode")==="dates_prestation"&&(d.jour<p.debut||d.jour>p.fin))
    return KO("G9 · politique temps.periode","Le "+fr(d.jour)+" est hors des dates de la mission ("+fr(p.debut)+" au "+fr(p.fin)+").");
  /* P-6 : plafond par jour, toutes missions confondues, capacité 1 jour */
  var deja=S.temps.filter(function(x){return x.pr===p.pr&&x.jour===d.jour;}).reduce(function(a,x){return a+x.qte;},0),plafond=pol("temps.plafond_jour"),alerte="";
  if(deja+q>1){
    if(plafond==="refus")return KO("P-6 · politique temps.plafond_jour",nomPr(p.pr)+" a déjà "+deja+" jour saisi le "+fr(d.jour)+" ; "+(deja+q)+" dépasse la capacité d'un jour. Le réglage actuel refuse — le défaut alerte.");
    if(plafond==="alerte")alerte=" Alerte : "+(deja+q)+" jour sur la journée du "+fr(d.jour)+", au-dessus de la capacité de 1. Enregistré quand même — c'est le réglage.";
  }
  db.insert("temps",{prestation:p.id,pr:p.pr,jour:d.jour,qte:q,ajust:false});
  ev("TimesheetRecorded","temps",p.id,nomPr(p.pr)+" — "+q+" jour le "+fr(d.jour)+alerte,"temps.periode, temps.plafond_jour");
  return OK("Temps enregistré. Il entrera dans le CA produit sans validation : c'est le choix V1."+alerte,"temps.periode, temps.plafond_jour");
};

/* toute commande passe par ici : un mur levé par db devient un refus nommé */
function run(name,d){
  try{return CMD[name]?CMD[name](d):KO("commande","Commande inconnue : "+name);}
  catch(x){if(x instanceof Mur)return KO(x.mur,x.msg);throw x;}
}

  var fam={};POL_DEF.forEach(function(p){(fam[p.f]=fam[p.f]||[]).push(p);});
  Object.keys(fam).forEach(function(f){
    h+='<div class="card" style="margin-bottom:12px"><h3>'+esc(f)+'</h3><div class="tab-box"><table><thead><tr><th>Clé</th><th>Valeur</th><th>Ce que ça change</th><th>Source</th></tr></thead><tbody>';
    fam[f].forEach(function(p){
      var v=pol(p.c),hb=p.hb&&p.hb.indexOf(v)>=0,tout=p.hb&&p.hb.length===p.o.length;
      h+='<tr class="'+(p.rouge?"rouge ":"")+(hb||tout?"hb":"")+'"><td><div class="mono" style="color:'+(p.rouge?"var(--crit)":"var(--ink)")+'">'+esc(p.c)+'</div><div class="tiny">'+esc(p.l)+'</div></td>'+
      '<td><select data-pol="'+esc(p.c)+'"'+(peut("SetPolicy")?"":" disabled")+' class="inl" style="max-width:240px;padding:6px 8px">'+p.o.map(function(o,i){return '<option value="'+esc(o)+'"'+(o===v?" selected":"")+'>'+esc(o.replace(/_/g," "))+(i===0?" (défaut)":"")+(p.hb&&p.hb.indexOf(o)>=0?" — hors banc":"")+'</option>';}).join("")+'</select>'+(v!==p.o[0]?'<div class="tiny" style="color:var(--warn)">modifié</div>':'')+'</td>'+
      '<td class="dim" style="font-size:12px">'+esc(p.e)+'</td><td class="mono tiny">'+esc(p.s)+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  return h+'<div class="note mur"><div class="t">Ce qui n\'est pas ici</div>Les 15 murs se tentent au <strong>banc</strong>, ils ne se règlent pas. Ce ne sont pas des préférences : c\'est ce qui rend les chiffres vrais.</div>';
}
function rendre(){
  nav();
  var f={tableau:ecranTableau,societes:ecranSocietes,candidats:ecranCandidats,ressources:ecranRessources,besoins:ecranBesoins,projets:ecranProjets,charge:ecranCharge,temps:ecranTemps,murs:ecranMurs,politiques:ecranPolitiques,positionner:ecranPositionner,prestation:ecranPrestation}[ui.ecran]||ecranTableau;
  vue.innerHTML=f();vue.scrollTop=0;
  document.getElementById("monde").textContent="monde au "+fr(S.aujourdhui)+" · "+POL_DEF.length+" réglages sur ceux du registre §E";
  journal();sauver();
}
function journal(){
  var l=S.ev.slice(-80).reverse();
  document.getElementById("ev-n").textContent=S.ev.length+" écrits";
  flux.innerHTML=l.map(function(e){return '<div class="ev'+(e.ko?" refus":"")+'"><div class="ty">'+esc(e.t)+'</div><div class="de">'+esc(e.d)+'</div>'+(e.p?'<div class="me">'+esc(e.p)+'</div>':'')+'<div class="me">par '+esc(e.a)+'</div></div>';}).join("")||'<div class="tiny">Rien encore.</div>';
}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify({s:S,r:roleActif}));}catch(x){}}
function charger(){
  try{var d=JSON.parse(localStorage.getItem(CLE));if(!d||!d.s||!d.s.personne)return false;S=d.s;roleActif=ROLES[d.r]?d.r:"staffing";
    ["action","snap","ev","absence","temps"].forEach(function(t){if(!S[t])S[t]=[];});
    if(!S.aujourdhui)S.aujourdhui="2027-04-06";if(!S.pol)S.pol={};
    POL_DEF.forEach(function(p){if(p.o.indexOf(S.pol[p.c])<0)S.pol[p.c]=p.o[0];});   /* clés manquantes ou valeurs hors registre (ex. temps.periode = libre) : retour au défaut */
    Object.keys(S.pol).forEach(function(k){if(!POL[k])delete S.pol[k];});
    S.ev.forEach(function(e,i){if(!e.id)e.id="EV-old-"+i;});
    /* migration v5 → v6 : rôles nettoyés (D-3), statuts explicites (D-2), devise du coût (D-9) */
    S.societe.forEach(function(x){
      if(!Array.isArray(x.roles))x.roles=[];
      if(x.roles.indexOf("client")>=0&&x.statut!=="client")x.statut="client";
      x.roles=x.roles.filter(function(r){return r==="fournisseur"||r==="interne";});
      if(x.statut==="interne"){x.statut=null;if(x.roles.indexOf("interne")<0)x.roles.push("interne");}
    });
    S.unite.forEach(function(x){if(x.statut===undefined)x.statut=null;});
    S.contact.forEach(function(x){if(x.statut===undefined)x.statut=null;});
    S.projet.forEach(function(x){if(x.devise_defaut===undefined)x.devise_defaut=x.devise||"EUR";delete x.devise;});
    S.prestation.forEach(function(x){if(!x.cjm_devise)x.cjm_devise=x.devise||"EUR";});
    S.snap.forEach(function(x){if(x.ca_devise===undefined){x.ca_devise=x.devise||"EUR";x.cout_devise=x.ca_devise;x.cout=null;x.marge=null;delete x.devise;}
      if(x.marge==null&&x.marge_motif===undefined)x.marge_motif=(x.cout_devise!==x.ca_devise)?"devises":(x.ca==null?"ca":"cout");});
    if(!ROLES[roleActif])roleActif="staffing";
    return true;}catch(x){return false;}
}
/* ===================== ÉVÉNEMENTS UI ===================== */
function val(i){var e=document.getElementById(i);return e?e.value:"";}
function coche(i){var e=document.getElementById(i);return !!(e&&e.checked);}
document.addEventListener("click",function(ev2){
  var b=ev2.target.closest("button");if(!b)return;
  if(b.dataset.skin){peau(b.dataset.skin);return;}
  if(b.dataset.ecran){ui.ecran=b.dataset.ecran;ui.ctx={};rendre();return;}
  if(b.id==="btn-reset"){neuf();ui.ecran="tableau";rendre();dis({ok:true,msg:"Monde réinitialisé."});return;}
  if(b.dataset.mur!==undefined){var m=MURS[parseInt(b.dataset.mur,10)],r0=m.f();if(r0.ok&&m.id!=="M-14")r0.msg="Attention : l'opération est passée. "+r0.msg;dis(r0);rendre();return;}
  var c=b.dataset.cmd;if(!c)return;var d={},res;
  if(c==="__pos"){ui.ecran="positionner";ui.ctx={besoin:b.dataset.besoin,pc:b.dataset.pc};rendre();return;}
  if(c==="__prest"){ui.ecran="prestation";ui.ctx={projet:b.dataset.projet};rendre();return;}
  if(c==="__faire-pos"){var p=val("po-profil").split(":");res=p[0]==="pc"?run("PositionCandidate",{besoin:val("po-besoin"),pc:p[1]}):run("PositionResource",{besoin:val("po-besoin"),pr:p[1]});dis(res);if(res.ok){ui.ecran="besoins";ui.ctx={};}rendre();return;}
  switch(c){
    case "CreateCompany":d={nom:val("so-nom"),statut:val("so-statut"),ville:val("so-ville"),roles:[coche("so-r-f")?"fournisseur":null,coche("so-r-i")?"interne":null].filter(Boolean)};break;
    case "CreateContact":d={societe:val("ct-soc"),nom:val("ct-nom"),fonction:val("ct-fct")};break;
    case "CreateCandidate":d={nom:val("ca-nom"),titre:val("ca-titre")};break;
    case "CreateNeed":d={societe:val("be-soc"),contact:val("be-ct"),titre:val("be-titre"),type:val("be-type"),priorite:val("be-prio"),postes:val("be-postes")};break;
    case "CreateProject":d={societe:val("pj-soc"),contact:val("pj-ct"),titre:val("pj-titre"),type:val("pj-type"),devise_defaut:val("pj-dev")};break;
    case "CreatePrestation":d={projet:b.dataset.projet,pr:val("pe-pr"),etat:val("pe-etat"),debut:val("pe-deb"),fin:val("pe-fin"),taux:val("pe-taux"),jours:val("pe-jours"),tjm:val("pe-tjm"),cjm:val("pe-cjm"),devise:val("pe-dev"),cjm_devise:val("pe-cdev")};break;
    case "RecordTimesheet":d={prestation:b.dataset.prestation,jour:val("tp-j-"+b.dataset.prestation),qte:val("tp-q-"+b.dataset.prestation)};break;
    case "RecordClientDecision":d={pos:b.dataset.pos,retenu:b.dataset.retenu==="1"};break;
    case "WithdrawPositioning":d={pos:b.dataset.pos,motif:val("wd-"+b.dataset.pos)};break;
    case "CreateProjectFromNeed":d={besoin:b.dataset.besoin,contact:val("pjct-"+b.dataset.besoin)||null};break;
    case "SuspendNeed":case "CloseNeed":d={besoin:b.dataset.besoin,motif:val("mot-"+b.dataset.besoin)};break;
    case "SetResourceState":d={pr:b.dataset.pr,etat:val("rs-"+b.dataset.pr)};break;
    case "RequalifyCompany":d={societe:b.dataset.societe,motif:"requalification manuelle"};break;
    default:d={pc:b.dataset.pc,pos:b.dataset.pos,besoin:b.dataset.besoin,projet:b.dataset.projet,prestation:b.dataset.prestation,pr:b.dataset.pr};
  }
  res=run(c,d);dis(res);
  if(res.ok&&c==="CreatePrestation")ui.ecran="projets";
  rendre();
});
document.addEventListener("change",function(e){
  var s=e.target;
  if(s.id==="sel-role"){roleActif=s.value;if(ui.ecran==="temps"&&!maPersonne())ui.ecran="tableau";rendre();return;}
  if(s.dataset.pol){dis(run("SetPolicy",{cle:s.dataset.pol,val:s.value}));rendre();return;}
  if(s.id==="be-soc"){var w=document.getElementById("be-ct");if(w)w.outerHTML=selCt("be-ct",s.value);return;}
  if(s.id==="pj-soc"){var w2=document.getElementById("pj-ct");if(w2)w2.outerHTML=selCt("pj-ct",s.value);return;}
});
function peau(k){
  if(["nuit","clair","avaliance"].indexOf(k)<0)k="nuit";
  document.documentElement.setAttribute("data-skin",k);
  document.querySelectorAll(".peaux button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.skin===k?"true":"false");});
  try{localStorage.setItem(CLE_SKIN,k);}catch(x){}
}
/* ===================== DÉMARRAGE ===================== */
var sk="nuit";try{sk=localStorage.getItem(CLE_SKIN)||"nuit";}catch(x){}
peau(sk);
var sr=document.getElementById("sel-role");
sr.innerHTML=Object.keys(ROLES).map(function(k){return '<option value="'+k+'">'+esc(ROLES[k].nom)+'</option>';}).join("");
if(!charger())neuf();
sr.value=roleActif;
rendre();
})();

</script>
